# Demo-only resources. No production resources or Vercel settings are referenced.
databases:
  - name: cybershield-demo-db-20261115
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: cybershield_demo_db_20261115
    user: cybershield_demo_db_20261115_user
    ipAllowList: []

services:
  - type: web
    name: cybershield-langgraph-demo-20261115
    runtime: docker
    repo: https://github.com/MoAftab-01/CyberShield-AI
    branch: feature/cybergpt-2-source-foundation
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-demo-db-20261115
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_DATABASE_HOST_PREFIX
        value: dpg-dbsf2bbm8hqs73ciou5g-a
      - key: DEMO_DATABASE_NAME
        value: cybershield_demo_db_20261115
      - key: DEMO_DATABASE_USER
        value: cybershield_demo_db_20261115_user
      - key: ENVIRONMENT
        value: staging
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: ""
      - key: EMBEDDING_BACKEND
        value: hash
      - key: VECTOR_DB_DIR
        value: /app/vector_db
      - key: CYBERGPT_V2_ENABLED
        value: "false"
      - key: CVE_INVESTIGATION_ENABLED
        value: "true"
      - key: CVE_INVESTIGATION_LIVE_APPROVED
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: GROQ_API_KEY
        value: ""
      - key: OPENAI_API_KEY
        value: ""
      - key: VT_API_KEY
        value: ""
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
