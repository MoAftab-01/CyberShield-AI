services:

  postgres:
    image: postgres:16
    container_name: cybershield-postgres

    environment:
      POSTGRES_DB: cybershield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  ollama:
    build:
      context: ./ollama

    container_name: cybershield-ollama

    environment:
      OLLAMA_MODEL: llama3:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: cybershield-backend

    env_file:
      - backend/.env

    depends_on:
      - postgres
      - ollama

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: cybershield-frontend

    depends_on:
      - backend

    ports:
      - "80:80"

    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data: